name: Audit

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    container:
      image: python:3.14-trixie
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Record audit reports for supported Python versions
        run: |
          for python_version in 3.12 3.13 3.14; do
            uv audit --locked --python-version "$python_version" --output-format json \
              > "uv_audit_report_${python_version}.json" || true
          done

      - name: Check for vulnerabilities across supported Python versions
        run: |
          audit_status=0
          for python_version in 3.12 3.13 3.14; do
            echo "Auditing dependencies for Python ${python_version}"
            uv audit --locked --python-version "$python_version" || audit_status=1
          done
          exit "$audit_status"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uv-audit-report
          path: uv_audit_report_*.json
          if-no-files-found: warn
          retention-days: 28