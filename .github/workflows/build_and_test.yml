name: Test

on:
  workflow_call:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build (Python 3.12)
    runs-on: ubuntu-latest
    container:
      image: python:3.12-trixie
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Build distributions
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  test:
    name: Test wheel (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
    container:
      image: python:${{ matrix.python-version }}-trixie
    steps:
      - name: Install Git LFS
        run: apt-get update && apt-get install -y git-lfs

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist

      - name: Install test dependencies and wheel
        run: |
          uv sync --locked --group dev --no-install-project
          uv pip install --python .venv/bin/python --no-deps dist/*.whl

      - name: Install CityDPC
        run: >-
          uv pip install --python .venv/bin/python
          git+https://github.com/ffe-munich/CityDPC.git@main

      - name: Verify installed package
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import sysconfig
          import lod2_buildings_downloader

          location = Path(lod2_buildings_downloader.__file__).resolve()
          print(f"Testing installed package: {location}")
          assert location.is_relative_to(Path(sysconfig.get_path("purelib")).resolve()), location
          PY

      - name: Run tests
        run: .venv/bin/python -m pytest -n auto --dist loadscope -v --tb=auto --junitxml=test_report.xml ./tests
        timeout-minutes: 30

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-python-${{ matrix.python-version }}
          path: test_report.xml
          if-no-files-found: warn
          retention-days: 28
